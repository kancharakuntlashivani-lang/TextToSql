name: TextToSQL CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: texttosql-production
  cancel-in-progress: true

jobs:
  build:
    name: Validate and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app.py src

      - name: Verify required imports
        run: |
          python - <<'PY'
          import importlib

          packages = [
              "streamlit",
              "pandas",
              "numpy",
              "sklearn",
              "scipy",
              "sqlalchemy",
              "openai",
          ]

          for package in packages:
              importlib.import_module(package)
              print(f"[OK] {package}")

          print("All required imports completed successfully.")
          PY

      - name: Build Docker image
        run: |
          docker build \
            --tag texttosql:${{ github.sha }} \
            .

  deploy:
    name: Deploy to Render
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "GitHub secret RENDER_DEPLOY_HOOK_URL is missing."
            exit 1
          fi

          curl \
            --fail \
            --show-error \
            --silent \
            --location \
            "$RENDER_DEPLOY_HOOK_URL"

          echo
          echo "Render deployment triggered successfully."

      - name: Show deployed application URL
        env:
          RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
        run: |
          echo "Application URL: $RENDER_SERVICE_URL"
